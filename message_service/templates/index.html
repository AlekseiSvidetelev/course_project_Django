{% extends 'base.html' %}

{% block title %}Главная страница{% endblock %}

{% block content %}
<h1 class="display-4 text-center">Добро пожаловать!</h1>
<p class="lead text-center">Удобный сервис для управления рассылками.</p>

<div class="row justify-content-md-center mt-4">
    <div class="col-md-6 col-sm-12">
        <div class="card shadow">
            <div class="card-body">
                <h5 class="card-title">Управление рассылками</h5>
                <p class="card-text">Создавайте, управляйте и отслеживайте эффективность ваших рассылок.</p>
                <a href="{% url 'message_service:mailings' %}" class="btn btn-primary">Посмотреть рассылки</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
