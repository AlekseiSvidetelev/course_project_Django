{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <title>{% block title %}{% endblock %}</title>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'mailings:home' %}">Моя рассылка</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <ul class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                <li class="nav-item"><a class="nav-link active" href="#">Выход</a></li>
                {% else %}
                <li class="nav-item"><a class="nav-link active" href="#">Войти</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Регистрация</a></li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-md-2">
            <div class="list-group">
                <a href="{% url 'mailings_message:list_messages' %}" class="list-group-item list-group-item-action">Сообщения</a>
                <a href="{% url 'clients:clients_list' %}}" class="list-group-item list-group-item-action">Получатели</a>
                <a href="#" class="list-group-item list-group-item-action">Рассылки</a>
                <a href="#" class="list-group-item list-group-item-action">Все попытки</a>
            </div>
        </div>
        <div class="col-md-10">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>

<!-- Нижний колонтитул -->
<footer class="bg-light py-3 mt-4 fixed-bottom">
    <div class="container text-center">
        <small>© {{ now|date:'Y' }} Моя рассылка | Все права защищены</small>
    </div>
</footer>

<!-- Bootstrap JS и Popper.js -->
<script src="{% static 'js/popper.min.js' %}"></script>
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

</body>
</html>
