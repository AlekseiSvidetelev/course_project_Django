{% extends 'base.html' %}
{% block title %}Авторизация пользователя{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4>Авторизация</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="{{ form.username.id_for_label }}" class="form-label">
                                {{ form.username.label }}
                            </label>
                            <input
                                    type="text"
                                    name="{{ form.username.name }}"
                                    id="{{ form.username.id_for_label }}"
                                    class="form-control"
                                    value="{{ form.username.value|default:'' }}">
                        </div>

                        <div class="mb-3">
                            <label for="{{ form.password.id_for_label }}" class="form-label">
                                {{ form.password.label }}
                            </label>
                            <input
                                    type="password"
                                    name="{{ form.password.name }}"
                                    id="{{ form.password.id_for_label }}"
                                    class="form-control">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-2">
                            Войти
                        </button>
                        <a href="{% url 'users:register' %}" class="btn btn-outline-primary w-100">
                            Регистрация
                        </a>
                        <div class="mt-3">
                            <a href="{% url 'users:password_reset_request' %}" class="btn btn-outline-primary w-100"
                            >Забыли пароль?</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
